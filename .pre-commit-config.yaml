repos:
  - repo: local
    hooks:
      - id: sync-claude-memory
        name: Sync OpenClaude memory
        entry: ./.claude/sync-claude-memory.sh pull
        language: script
        pass_filenames: false

  - repo: https://github.com/GitGuardian/ggshield
    rev: v1.34.0
    hooks:
      - id: ggshield
        name: GitGuardian ggshield
        language_version: python3
        stages: [pre-commit]
